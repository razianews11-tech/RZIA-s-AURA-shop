[build]
command = "npm run build"
publish = "dist"

[functions]
directory = "netlify/functions"

[[redirects]]
from = "/api/admin/login"
to = "/.netlify/functions/admin/login"
status = 200

[[redirects]]
from = "/api/admin/data"
to = "/.netlify/functions/admin/data"
status = 200

[[redirects]]
from = "/api/upload"
to = "/.netlify/functions/upload"
status = 200

[[redirects]]
from = "/api/image/*"
to = "/.netlify/functions/image/:splat"
status = 200

[[redirects]]
from = "/api/data"
to = "/.netlify/functions/data"
status = 200

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
